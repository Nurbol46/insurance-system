<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Статус полиса</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">Insurance Company</a>
      <nav class="site-nav">
        <a href="index.html">Главная</a>
        <a href="services.html">Каталог услуг</a>
        <a href="application.html">Онлайн заявка</a>
        <a href="status.html">Статус полиса</a>
        <a href="contact.html">Контакты</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container page-content">
    <h1>Проверка статуса полиса</h1>
    <form id="status-form" class="form-card">
      <label>Номер полиса
        <input type="text" name="policyNumber" placeholder="POL-123456-7890" required />
      </label>
      <button type="submit" class="button">Проверить</button>
    </form>
    <div id="status-result" class="status-result">
      <h2>Результат</h2>
      <p>Введите номер полиса и нажмите «Проверить».</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Страховая фирма — Система управления полисами</p>
    </div>
  </footer>
  <script src="js/api.js"></script>
  <script src="js/status.js"></script>
</body>
</html>
