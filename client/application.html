<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Онлайн заявка</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">Insurance Company</a>
      <nav class="site-nav">
        <a href="index.html">Главная</a>
        <a href="services.html">Каталог услуг</a>
        <a href="application.html">Онлайн заявка</a>
        <a href="status.html">Статус полиса</a>
        <a href="contact.html">Контакты</a>
      </nav>
      <div class="auth-links"></div>
    </div>
  </header>

  <main class="container page-content">
    <h1>Оформление страховки</h1>
    <p>Заполните форму и мы свяжемся с вами для подтверждения.</p>

    <form id="application-form" class="form-card">
      <label>ФИО
        <input type="text" name="name" placeholder="Иванов Иван Иванович" required />
      </label>
      <label>Email
        <input type="email" name="email" placeholder="example@mail.ru" required />
      </label>
      <label>Телефон
        <input type="tel" name="phone" placeholder="+7 700 000 0000" required />
      </label>
      <label>Тип страхования
        <select name="service" required>
          <option value="">Выберите услугу</option>
          <option value="auto">Автострахование</option>
          <option value="health">Медицинское страхование</option>
          <option value="property">Имущественное страхование</option>
          <option value="life">Страхование жизни</option>
        </select>
      </label>
      <label>Комментарий
        <textarea name="message" placeholder="Дополнительные данные"></textarea>
      </label>
      <button type="submit" class="button">Отправить заявку</button>
      <p id="application-feedback" class="feedback"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Страховая фирма — Система управления полисами</p>
    </div>
  </footer>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
